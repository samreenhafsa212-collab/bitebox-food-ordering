<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login | BiteBox</title><style>body{font-family:system-ui;background:#fbf8f3;display:grid;place-items:center;min-height:100vh;margin:0}.panel{background:white;padding:28px;border:1px solid #e4e8e8;border-radius:18px;width:min(380px,90vw)}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;margin-top:10px}input{border:1px solid #ccd5d8}button{background:#142f42;color:white;border:0;font-weight:800}.err{color:#a33428;font-size:13px}</style></head><body><form class="panel" method="post"><h1>BiteBox Admin</h1><p>Sign in to manage orders.</p>{% if error %}<p class="err">{{error}}</p>{% endif %}<label>Admin password<input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button></form></body></html>
